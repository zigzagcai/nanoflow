[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoflow"
version = "0.1.0"
description = "A tiny durable workflow runtime for long-horizon agentic tasks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "nanoflow contributors"}]

[project.scripts]
nanoflow = "nanoflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
